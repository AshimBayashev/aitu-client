<!doctype html>
<html lang="ru" data-theme="dark" data-density="cozy">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Aitu</title>
    <script>
      try {
        const raw = localStorage.getItem("aitu-client-v1");
        if (raw) {
          const settings = JSON.parse(raw).settings || {};
          if (settings.theme === "light" || settings.theme === "dark") {
            document.documentElement.dataset.theme = settings.theme;
          }
          if (settings.accent) document.documentElement.style.setProperty("--accent", settings.accent);
          if (settings.fontSize) document.documentElement.style.fontSize = settings.fontSize + "px";
        }
      } catch (error) {}
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
